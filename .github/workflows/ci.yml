name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: Relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --offline: only local files and #anchors are checked; external URLs are skipped.
      - name: lychee
        run: >-
          docker run --rm -v "$PWD":/input:ro -w /input lycheeverse/lychee:0.24.2
          --offline --include-fragments --no-progress './**/*.md'
